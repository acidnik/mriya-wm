[package]
name = "mriya-wm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Mriya WM - a stacking Wayland window manager"
license = "MIT"

[dependencies]
anyhow = "1"
bitflags = "2"
cosmic-text = "0.17.0"
cursor-icon = "1.2.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
inotify = "0.11.5"
kdl = { version = "6.3.4", default-features = false, features = ["v1-fallback", "span"] }
regex = "1.13.2"
resvg = { version = "0.45.1", default-features = false }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    # Frontend on a TTY: own the GPU through libseat/logind, take input from
    # libinput, find devices through udev.
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_multi",
    "desktop",
    "wayland_frontend",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"

# Debug builds stay fast enough to run a compositor.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
